services:
  app:
    build: .
    ports:
      # Host port 8501 → container port 8501
      # Open http://localhost:8501 in your browser
      - "8501:8501"
    volumes:
      # Mount source code so you can edit app.py and see changes.
      # Unlike the Node app, Streamlit's hot-reload works via its own
      # file watcher — but we disabled that above for Docker stability.
      # To see changes: just restart with `docker compose restart app`.
      - .:/app
    environment:
      # Reads from a .env file in the project root (see .env.example).
      # Never commit the actual .env file — it contains your API key.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    # Automatically restart the container if it crashes
    restart: unless-stopped